name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # First-cut Windows/MSVC port (#93). Deliberately leaner than
  # build-and-test below: no fixture-disabled / critical-test-name / skip
  # guards yet -- those are worth porting to pwsh once the build itself is
  # stable, not while still iterating on whether it compiles at all.
  windows:
    runs-on: windows-latest
    name: Windows (MSVC)
    env:
      # x-gha is vcpkg's native GitHub Actions cache binary source: without
      # it, every run rebuilds FFmpeg + x264/x265 + OpenCV from source, each
      # comfortably over an hour.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v5

      # Exposes ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN to later steps --
      # vcpkg's x-gha source reads exactly these two env vars.
      - name: Enable vcpkg GitHub Actions binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Ninja (single-config, so no per-config -C flags downstream) needs
      # cl.exe on PATH, which this action sets up.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # vcvarsall.bat (run above) sets its own VCPKG_ROOT pointing at this VS
      # install's bundled vcpkg copy and the action exports that to every
      # later step, silently overriding whatever the job set. Point it back
      # at the checkout this job manages below -- must run after the MSVC
      # step, not in job-level env:, or it gets clobbered right back.
      - name: Point VCPKG_ROOT at our own checkout
        run: |
          "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV

      - name: Install Ninja and ffmpeg CLI (fixture generation)
        run: |
          choco install ninja --no-progress -y
          choco install ffmpeg --no-progress -y

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: pip install pybind11 numpy pytest

      - name: Locate pybind11 CMake dir
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pb11 = python -c "import pybind11; print(pybind11.get_cmake_dir())"
          "PYBIND11_CMAKE_DIR=$pb11" >> $env:GITHUB_ENV

      # $PSNativeCommandUseErrorActionPreference makes a failing native
      # command (nonzero exit) a terminating error like $ErrorActionPreference
      # already is for cmdlets, so a first-line failure stops the script
      # instead of running the next line against broken state and surfacing
      # a confusing, unrelated-looking error there instead.
      - name: Bootstrap vcpkg
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      # No separate "vcpkg install" step: a bare `vcpkg.exe install` run from
      # the repo root installs manifest dependencies into
      # <repo-root>/vcpkg_installed/, but CMake's own vcpkg toolchain
      # integration (triggered below, during Configure) installs into
      # <build-dir>/vcpkg_installed/ instead -- a different directory. The
      # first attempt at this job had both steps, so every run built FFmpeg
      # + x264 + x265 + OpenCV from source *twice*, once into a location
      # nothing else used. Let Configure's manifest-mode install be the only
      # one; it is a real (if first-time slow) build either way, but at
      # least it happens once, and the x-gha binary cache makes every run
      # after the first fast once it's warm.
      # Examples off: compare_readers.cpp uses cv::imwrite/cv::VideoCapture
      # (imgcodecs/videoio), which are not part of the trimmed opencv4[core]
      # vcpkg feature set below (opencv4's *default* Windows feature set
      # additionally pulls in dnn/gapi/highgui/directml/dshow/msmf/win32ui --
      # protobuf alone, needed only for dnn, took 18 minutes to build. None
      # of it is needed to validate the library + test suite under MSVC,
      # which is this job's actual job; examples can gain the extra
      # opencv4 features back if this job's scope grows to cover them.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DFRAMEWRIGHT_BUILD_TESTS=ON -DFRAMEWRIGHT_BUILD_EXAMPLES=OFF -DFRAMEWRIGHT_BUILD_PYTHON=ON -Dpybind11_DIR="$env:PYBIND11_CMAKE_DIR"

      - name: Build
        run: cmake --build build

      - name: Test (C++)
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Test (Python)
        run: |
          $env:PYTHONPATH = "$PWD\build;$PWD\python"
          $env:TEST_FIXTURES_DIR = "$PWD\build\test_fixtures"
          pytest python/tests/ -v

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          # Both OpenCV majors are covered. Pinning only to opencv@4 would let
          # a 5.x incompatibility land unnoticed; testing only 5 would drop the
          # version most distributions still ship. See #56.
          - os: macos-latest
            name: macOS (OpenCV 4)
            opencv: opencv@4
          - os: macos-latest
            name: macOS (OpenCV 5)
            opencv: opencv

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopencv-dev \
            libavformat-dev libavcodec-dev libswscale-dev libavutil-dev \
            pkg-config \
            ffmpeg \
            libx264-dev libx265-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ${{ matrix.opencv }} ffmpeg pkg-config x264 x265
          # opencv@4 is keg-only, so it needs an explicit prefix; the
          # unversioned formula does not, but pointing at it is harmless.
          echo "CMAKE_PREFIX_PATH=$(brew --prefix ${{ matrix.opencv }})" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: pip install pybind11 numpy pytest

      - name: Configure
        run: |
          set -o pipefail
          cmake -B build \
            -DFRAMEWRIGHT_BUILD_TESTS=ON \
            -DFRAMEWRIGHT_BUILD_EXAMPLES=ON \
            -DFRAMEWRIGHT_BUILD_PYTHON=ON \
            -Dpybind11_DIR=$(python3 -c "import pybind11; print(pybind11.get_cmake_dir())") \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      # Every test fixture is generated by ffmpeg at configure time, and the
      # test cases that use them are #ifdef-guarded. A fixture that fails to
      # generate therefore removes tests from the suite without failing
      # anything -- the same shape of silent gap as #55, where CI ran zero
      # tests and stayed green. All dependencies are installed above, so on CI
      # a disabled fixture is a real problem, not a graceful degradation.
      - name: Require all fixtures
        run: |
          if grep -q "fixture: DISABLED" configure.log; then
            grep "fixture: DISABLED" configure.log
            echo "::error::a test fixture failed to generate; the suite would silently shrink"
            exit 1
          fi
          grep "fixture: enabled" configure.log

      - name: Build
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      # Requiring the fixtures (above) catches a fixture that fails to
      # generate, but not a test case deleted outright or gated on something
      # other than a fixture. These are the cases covering bugs that reached
      # main and were expensive to find -- name them so their disappearance is
      # an error rather than a silently smaller suite. A total-count assertion
      # was considered instead and rejected: it needs bumping on every test
      # addition, which trains people to update it reflexively, and it reports
      # "the number changed" rather than which coverage was lost. See #58.
      - name: Require critical test cases
        run: |
          listing=$(build/framewright_tests --list-tests)
          missing=0
          checked=0
          while IFS= read -r name; do
            # The heredoc below is indented to satisfy YAML; strip that back
            # off or nothing will ever match and this check passes vacuously.
            name="${name#"${name%%[![:space:]]*}"}"
            [ -z "$name" ] && continue
            if grep -qF "$name" <<<"$listing"; then
              # Report matches, not just failures: a silent pass is
              # indistinguishable from a check that matched nothing.
              echo "ok: $name"
              checked=$((checked + 1))
            else
              echo "::error::missing test case: $name"
              missing=1
            fi
          done <<'CASES'
          VideoReader seek lands on the frame it reports
          VideoReader seek lands on the frame it reports (B-frames)
          VideoReader reads every frame through to EOF
          VideoReader seek leaves the position counter consistent
          VideoReader seek past the end fails
          CASES

          echo "verified $checked critical test cases"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no test names were checked; this guard is not working"
            exit 1
          fi
          exit $missing

      - name: Test (C++)
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # ctest reports pass/fail for the binary as a whole, and
      # --output-on-failure hides Catch2's summary on success -- so a green
      # build records nothing about how many cases actually ran. A case that
      # starts skipping stays present in --list-tests (so #65 does not catch
      # it) and needs no fixture (so #63 does not either), yet exercises
      # nothing. Every codec these tests need is installed above, so on CI a
      # skip is a real gap rather than graceful degradation. See #66.
      - name: Report and check test counts
        run: |
          set -o pipefail
          # Default console reporter, not --reporter compact: compact omits the
          # skip count entirely, so the check below would never see one.
          build/framewright_tests | tail -5 | tee catch2.log
          if grep -qiE "[1-9][0-9]* skipped" catch2.log; then
            echo "::error::test cases were skipped; CI should run the whole suite"
            exit 1
          fi

      - name: Test (Python)
        run: |
          export PYTHONPATH="$PWD/build:$PWD/python"
          export TEST_FIXTURES_DIR="$PWD/build/test_fixtures"
          pytest python/tests/ -v

  wasm:
    runs-on: ubuntu-24.04
    name: WASM (Node)

    steps:
      - uses: actions/checkout@v5

      # ffmpeg CLI (with libx265) only generates the smoke-test fixture; the
      # WASM module itself uses the Emscripten-built FFmpeg from wasm/deps.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # FFmpeg + OpenCV core compiled to WASM change only when build.sh (or
      # the pinned versions in this workflow) change, so cache the deps tree.
      # On a hit, build.sh skips both dependency builds and only relinks the
      # framewright module (~1 min).
      - name: Cache WASM dependencies
        id: wasm-deps
        uses: actions/cache@v4
        with:
          path: wasm/deps
          key: wasm-deps-v1-emsdk6.0.6-ffn6.1.2-ocv4.10.0-${{ hashFiles('wasm/build.sh') }}

      - name: Set up Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.6
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.6

      - name: Fetch dependency sources
        if: steps.wasm-deps.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n6.1.2 https://github.com/FFmpeg/FFmpeg.git "$RUNNER_TEMP/ffmpeg-src"
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git "$RUNNER_TEMP/opencv-src"

      - name: Build WASM module
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          FFMPEG_SRC="$RUNNER_TEMP/ffmpeg-src" OPENCV_SRC="$RUNNER_TEMP/opencv-src" ./wasm/build.sh

      - name: Smoke test (Node)
        run: |
          ./wasm/test/gen_fixture.sh "$RUNNER_TEMP/hdr10_matrix.mp4"
          node wasm/test/smoke.mjs "$RUNNER_TEMP/hdr10_matrix.mp4"
