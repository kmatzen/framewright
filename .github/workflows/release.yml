name: Release

# Two entry points, one flow: pushing a v* tag, or dispatching with a
# version input (which creates the tag). Either way the sdist + WASM
# artifacts are built, a GitHub release is created with the artifacts
# attached, and the sdist is published to PyPI via trusted publishing.
# Every step is idempotent, so the tag push that release creation itself
# triggers re-runs the workflow harmlessly.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0"
        required: true
  push:
    tags: ["v*"]

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-sdist:
    runs-on: ubuntu-24.04
    name: Build source distribution
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    name: Build wheels (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5

      - name: Build wheels
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build-wasm:
    runs-on: ubuntu-24.04
    name: Build WASM module
    steps:
      - uses: actions/checkout@v5

      # Same cache key as ci.yml, so the tag build reuses the deps compiled
      # on main and only relinks the module.
      - name: Cache WASM dependencies
        id: wasm-deps
        uses: actions/cache@v4
        with:
          path: wasm/deps
          key: wasm-deps-v1-emsdk6.0.6-ffn6.1.2-ocv4.10.0-${{ hashFiles('wasm/build.sh') }}

      - name: Set up Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.6
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.6

      - name: Fetch dependency sources
        if: steps.wasm-deps.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n6.1.2 https://github.com/FFmpeg/FFmpeg.git "$RUNNER_TEMP/ffmpeg-src"
          git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git "$RUNNER_TEMP/opencv-src"

      - name: Build WASM module
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          FFMPEG_SRC="$RUNNER_TEMP/ffmpeg-src" OPENCV_SRC="$RUNNER_TEMP/opencv-src" ./wasm/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            wasm/dist/framewright.js
            wasm/dist/framewright.wasm

  github-release:
    needs: [build-sdist, build-wheels, build-wasm]
    runs-on: ubuntu-24.04
    name: Create GitHub release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; uploading any new artifacts"
            gh release upload "$RELEASE_TAG" --clobber \
              artifacts/*.tar.gz artifacts/*.whl \
              artifacts/framewright.js artifacts/framewright.wasm
            exit 0
          fi
          # --target pins the tag gh creates when it does not exist yet
          # (workflow_dispatch); on a tag-push run the tag already exists and
          # the target is ignored.
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "framewright $RELEASE_TAG" \
            --generate-notes \
            artifacts/*.tar.gz artifacts/*.whl \
            artifacts/framewright.js artifacts/framewright.wasm

  publish:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-24.04
    name: Publish to PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/framewright/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{sdist,wheels-*}"
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The dispatch run and the tag push it causes both publish; the
          # second upload of the same version is skipped instead of failing.
          skip-existing: true
