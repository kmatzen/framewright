\* Reproduces the pre-fix state: seek()'s keyframe path (VideoReader.cpp,
\* before the start_time fix) ignored the stream's start_time in BOTH the
\* target-timestamp computation and the landing-position recovery.
\* StartTimeTicks = 5 with TicksPerFrame = 4 mirrors the real-world case the
\* bug report hit: a start_time that is not a whole number of frame
\* durations (there, 0.083s against a non-integer frame count of ticks).

SPECIFICATION Spec

CONSTANTS
    NumFrames     = 12
    Keyframes     = {0, 6}
    SeekThreshold = 3
    PtsAvailable  = TRUE
    TicksPerFrame        = 4
    StartTimeTicks        = 5
    FixTargetStartTime    = FALSE
    FixRecoveryStartTime  = FALSE

INVARIANTS
    TypeOK
    PositionAccurate
