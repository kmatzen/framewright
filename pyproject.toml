[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "framewright"
version = "0.3.0"
description = "Color-correct video I/O — drop-in replacement for OpenCV VideoCapture/VideoWriter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Kevin Blackburn-Matzen"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
]

[project.urls]
Homepage = "https://github.com/kmatzen/framewright"
Repository = "https://github.com/kmatzen/framewright"
Issues = "https://github.com/kmatzen/framewright/issues"

[tool.scikit-build]
cmake.args = ["-DFRAMEWRIGHT_BUILD_PYTHON=ON"]
wheel.packages = ["python/framewright"]

# Binary wheels: dependencies are built once per platform into a static,
# LGPL-clean prefix (scripts/build_wheel_deps.sh) and linked statically, so
# the extension module is self-contained. See docs in that script for what
# the LGPL constraint means (H.264/HEVC writing needs a source install).
[tool.cibuildwheel]
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*"]
skip = ["*-musllinux_*"]
test-requires = ["numpy"]
test-command = "python {project}/scripts/wheel_smoke.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "bash {project}/scripts/build_wheel_deps.sh /opt/fw-deps"
environment = { PKG_CONFIG_PATH = "/opt/fw-deps/lib/pkgconfig:/opt/fw-deps/lib64/pkgconfig", CMAKE_PREFIX_PATH = "/opt/fw-deps", CMAKE_ARGS = "-DFRAMEWRIGHT_STATIC_DEPS=ON" }

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "bash {project}/scripts/build_wheel_deps.sh /tmp/fw-deps"
environment = { PKG_CONFIG_PATH = "/tmp/fw-deps/lib/pkgconfig", CMAKE_PREFIX_PATH = "/tmp/fw-deps", CMAKE_ARGS = "-DFRAMEWRIGHT_STATIC_DEPS=ON", MACOSX_DEPLOYMENT_TARGET = "13.0" }

# Windows dependencies come from a throwaway vcpkg classic-mode install
# (scripts/build_windows_wheel_deps.sh), not the repo's vcpkg.json manifest
# used by CI (#93) -- that manifest enables gpl+x264+x265 for test coverage
# and uses the dynamic x64-windows triplet, both wrong for an LGPL-only,
# self-contained wheel. x64-windows-static-md links FFmpeg/OpenCV statically
# while keeping the dynamic CRT, matching CPython's own CRT linkage.
[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-all = "bash {project}/scripts/build_windows_wheel_deps.sh C:/vcpkg-wheel"
environment = { PKG_CONFIG_PATH = "C:/vcpkg-wheel/installed/x64-windows-static-md/lib/pkgconfig", CMAKE_PREFIX_PATH = "C:/vcpkg-wheel/installed/x64-windows-static-md", CMAKE_ARGS = "-DFRAMEWRIGHT_STATIC_DEPS=ON -DPKG_CONFIG_EXECUTABLE=C:/vcpkg-wheel/installed/x64-windows/tools/pkgconf/pkgconf.exe" }
